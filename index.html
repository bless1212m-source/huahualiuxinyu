<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>沙盒乐园 · 双人触摸版</title>
    <style>
        * {
            user-select: none;
            touch-action: none; /* 禁止浏览器滚动/缩放 */
        }
        body {
            background: linear-gradient(145deg, #b8e1fc 0%, #9ac2e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Segoe UI', cursive;
        }
        .game-container {
            background: #fdf8e7;
            border-radius: 48px;
            padding: 15px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            width: 100%;
            height: auto;
            max-width: 1000px;
            aspect-ratio: 1000 / 600;
            touch-action: none;
        }
        .toolbar {
            margin: 15px 5px 5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }
        .color-palette {
            display: flex;
            gap: 6px;
            background: #fff0db;
            padding: 6px 12px;
            border-radius: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: 0.1s;
        }
        .color-btn.active {
            border: 3px solid #ffaa33;
            transform: scale(1.1);
        }
        button {
            background: #ffb36b;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            color: white;
        }
        button:active {
            transform: scale(0.96);
        }
        .mode-btn {
            background: #8bc34a;
        }
        .mode-btn.active {
            background: #5a9e2e;
            box-shadow: 0 0 0 2px #ffdd88;
        }
        .fly-btn {
            background: #ffaa66;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .info {
            background: #fff0db;
            border-radius: 40px;
            padding: 4px 12px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-flex;
            gap: 12px;
            margin: 5px 0;
        }
        .controls-hint {
            font-size: 11px;
            color: #b97f44;
            margin-top: 8px;
            background: #fff0db88;
            border-radius: 20px;
            padding: 4px 8px;
            display: inline-block;
        }
        @media (max-width: 700px) {
            .color-btn { width: 28px; height: 28px; }
            button { padding: 5px 10px; font-size: 0.75rem; }
            .fly-btn { top: 10px; right: 10px; font-size: 0.8rem; padding: 5px 10px; }
            .info { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="600" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/600"></canvas>
        <div class="toolbar">
            <div class="color-palette" id="colorPalette"></div>
            <button id="flowerModeBtn" class="mode-btn">🌻 种花模式</button>
            <button id="resetBtn">🗑️ 清除</button>
            <div class="info">
                <span>🏠 李李: <span id="pos0">(0,0)</span></span>
                <span>🐱 毛毛: <span id="pos1">(0,0)</span></span>
                <span>⭐ 星星: <span id="starCount">0</span></span>
            </div>
        </div>
        <div class="controls-hint">
            🖐️ 左半屏滑动 → 李李 &nbsp;|&nbsp; 右半屏滑动 → 毛毛 &nbsp;|&nbsp;
            ✨ 点击格子放置/种花 &nbsp;|&nbsp; 长按格子拆除
        </div>
    </div>
    <button id="flyToggleBtn" class="fly-btn">🕊️ 飞行模式</button>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const width = 1000, height = 600;
        canvas.width = width;
        canvas.height = height;

        // 网格参数
        const gridW = 25;
        const gridH = 15;
        const cellW = width / gridW;
        const cellH = height / gridH;

        // 游戏数据
        let blocks = [];
        for (let i=0; i<gridH; i++) {
            blocks[i] = [];
            for (let j=0; j<gridW; j++) blocks[i][j] = null;
        }

        const colors = ['#FFB7C5', '#A7E0E0', '#FFD966', '#98FB98', '#FFB347', '#C5E99B', '#F4A261', '#D9BF77'];
        let currentColor = colors[0];
        let isFlowerMode = false;

        let players = [
            { name: '李李', x: 5, y: 5, fly: false, color: '#FFB7C5', hair: '#B5651E' },
            { name: '毛毛', x: 8, y: 7, fly: false, color: '#A7E0E0', hair: '#8B5A2B' }
        ];
        let currentControl = 0; // 用于飞行按钮切换的角色

        // 小猫
        let cats = [
            { name: '钢镚', type: 'silver', eyeColor: '#88DD66', offsetAngle: 0, radius: 22 },
            { name: '塑料袋', type: 'calico', eyeColor: '#88DD66', offsetAngle: Math.PI, radius: 22 }
        ];
        let catAngle = 0;

        // 星星
        let stars = [];
        let starTreeList = [];
        let meteors = [];
        let meteorTimer = null;

        // 触摸移动控制相关
        let touchStartPos = { left: null, right: null };
        let lastTouchPos = { left: null, right: null };

        function spawnRandomStar() {
            if (stars.length >= 5) return;
            let row, col;
            do {
                row = Math.floor(Math.random() * gridH);
                col = Math.floor(Math.random() * gridW);
            } while (blocks[row][col] !== null || isPlayerOn(row, col));
            stars.push({ x: col * cellW + cellW/2, y: row * cellH + cellH/2, row, col });
            updateStarUI();
        }

        function isPlayerOn(row, col) {
            return (players[0].y === row && players[0].x === col) || (players[1].y === row && players[1].x === col);
        }

        function collectStar(row, col) {
            let idx = stars.findIndex(s => s.row === row && s.col === col);
            if (idx !== -1) {
                stars.splice(idx,1);
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'starTree', plantedTime: Date.now() };
                    starTreeList.push({ row, col });
                }
                startMeteorShower();
                updateStarUI();
            }
        }

        function startMeteorShower() {
            if (meteorTimer) clearTimeout(meteorTimer);
            for (let i=0; i<60; i++) {
                meteors.push({
                    x: Math.random() * width,
                    y: Math.random() * height - 100,
                    vx: (Math.random() - 0.5) * 3 + 1,
                    vy: 2 + Math.random() * 4,
                    size: 2 + Math.random() * 5,
                    alpha: 1,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 70%)`
                });
            }
            meteorTimer = setTimeout(() => { meteorTimer = null; }, 5000);
        }

        function updateStarUI() {
            document.getElementById('starCount').innerText = stars.length;
        }

        function placeItem(row, col) {
            if (row<0 || row>=gridH || col<0 || col>=gridW) return false;
            if (isPlayerOn(row, col)) return false;
            if (isFlowerMode) {
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'flower', color: '#FFC0CB' };
                    return true;
                }
            } else {
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'block', color: currentColor };
                    return true;
                }
            }
            return false;
        }

        function removeItem(row, col) {
            if (blocks[row][col] !== null) {
                blocks[row][col] = null;
                starTreeList = starTreeList.filter(t => !(t.row === row && t.col === col));
                return true;
            }
            return false;
        }

        function movePlayer(pIdx, dx, dy) {
            let p = players[pIdx];
            let newX = p.x + dx;
            let newY = p.y + dy;
            if (newX<0 || newX>=gridW || newY<0 || newY>=gridH) return;
            if (!p.fly) {
                let target = blocks[newY][newX];
                if (target !== null && (target.type === 'block' || target.type === 'flower' || target.type === 'starTree')) {
                    return;
                }
            }
            p.x = newX;
            p.y = newY;
            let starIdx = stars.findIndex(s => s.row === p.y && s.col === p.x);
            if (starIdx !== -1) collectStar(p.y, p.x);
            updatePosUI();
        }

        function updatePosUI() {
            document.getElementById('pos0').innerText = `(${players[0].x},${players[0].y})`;
            document.getElementById('pos1').innerText = `(${players[1].x},${players[1].y})`;
        }

        function resetBuildings() {
            for (let i=0; i<gridH; i++)
                for (let j=0; j<gridW; j++) blocks[i][j] = null;
            starTreeList = [];
            stars = [];
            for (let i=0; i<3; i++) spawnRandomStar();
        }

        // 触摸控制：根据触摸区域移动角色
        function handleTouchMove(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touches = e.touches;
            for (let i=0; i<touches.length; i++) {
                const touch = touches[i];
                const canvasX = (touch.clientX - rect.left) * scaleX;
                const canvasY = (touch.clientY - rect.top) * scaleY;
                const halfWidth = canvas.width / 2;
                const isLeft = canvasX < halfWidth;
                if (isLeft) {
                    if (!lastTouchPos.left) {
                        lastTouchPos.left = { x: canvasX, y: canvasY };
                        continue;
                    }
                    let dx = canvasX - lastTouchPos.left.x;
                    let dy = canvasY - lastTouchPos.left.y;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        let moveX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                        let moveY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                        if (moveX !== 0 || moveY !== 0) movePlayer(0, moveX, moveY);
                        lastTouchPos.left = { x: canvasX, y: canvasY };
                    }
                } else {
                    if (!lastTouchPos.right) {
                        lastTouchPos.right = { x: canvasX, y: canvasY };
                        continue;
                    }
                    let dx = canvasX - lastTouchPos.right.x;
                    let dy = canvasY - lastTouchPos.right.y;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        let moveX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                        let moveY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                        if (moveX !== 0 || moveY !== 0) movePlayer(1, moveX, moveY);
                        lastTouchPos.right = { x: canvasX, y: canvasY };
                    }
                }
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            lastTouchPos.left = null;
            lastTouchPos.right = null;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            lastTouchPos.left = null;
            lastTouchPos.right = null;
        }

        // 绘制所有内容（与之前相同，略作简化）
        function draw() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = "#b3d9a0";
            ctx.fillRect(0,0,width,height);
            ctx.strokeStyle = "#d9d0a5";
            for (let i=0; i<=gridW; i++) {
                ctx.beginPath();
                ctx.moveTo(i*cellW,0);
                ctx.lineTo(i*cellW,height);
                ctx.stroke();
                ctx.moveTo(0,i*cellH);
                ctx.lineTo(width,i*cellH);
                ctx.stroke();
            }

            for (let row=0; row<gridH; row++) {
                for (let col=0; col<gridW; col++) {
                    let item = blocks[row][col];
                    if (!item) continue;
                    let x = col * cellW;
                    let y = row * cellH;
                    if (item.type === 'block') {
                        ctx.fillStyle = item.color;
                        ctx.fillRect(x+1, y+1, cellW-2, cellH-2);
                        ctx.fillStyle = "rgba(0,0,0,0.1)";
                        ctx.fillRect(x+2, y+2, cellW-4, 3);
                    } else if (item.type === 'flower') {
                        ctx.fillStyle = "#FFC0CB";
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, cellW*0.3, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#F06292";
                        for (let i=0;i<5;i++) {
                            let ang = i*Math.PI*2/5;
                            let px = x+cellW/2 + Math.cos(ang)*cellW*0.2;
                            let py = y+cellH/2 + Math.sin(ang)*cellW*0.2;
                            ctx.beginPath();
                            ctx.arc(px, py, cellW*0.12, 0, Math.PI*2);
                            ctx.fill();
                        }
                    } else if (item.type === 'starTree') {
                        ctx.fillStyle = "#8B5A2B";
                        ctx.fillRect(x+cellW*0.4, y+cellH*0.5, cellW*0.2, cellH*0.3);
                        ctx.fillStyle = "#FFD966";
                        ctx.beginPath();
                        ctx.moveTo(x+cellW/2, y+cellH*0.3);
                        ctx.lineTo(x+cellW*0.3, y+cellH*0.5);
                        ctx.lineTo(x+cellW*0.7, y+cellH*0.5);
                        ctx.fill();
                        ctx.fillStyle = "#FFB347";
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH*0.2, cellW*0.12, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }

            for (let s of stars) {
                ctx.fillStyle = "#FFD966";
                let spikes = 5, outer = cellW*0.25, inner = cellW*0.12;
                let cx = s.x, cy = s.y;
                ctx.beginPath();
                for (let i=0; i<spikes*2; i++) {
                    let rad = (i * Math.PI*2 / (spikes*2)) - Math.PI/2;
                    let r = (i%2===0) ? outer : inner;
                    let px = cx + Math.cos(rad)*r;
                    let py = cy + Math.sin(rad)*r;
                    if (i===0) ctx.moveTo(px,py);
                    else ctx.lineTo(px,py);
                }
                ctx.fill();
                ctx.fillStyle = "#FFB347";
                ctx.beginPath();
                ctx.arc(cx, cy, cellW*0.08, 0, Math.PI*2);
                ctx.fill();
            }

            for (let p of players) {
                let x = p.x * cellW;
                let y = p.y * cellH;
                if (p.fly) {
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#FFDD88";
                }
                ctx.fillStyle = p.hair;
                ctx.beginPath();
                ctx.ellipse(x+cellW/2, y+cellH*0.35, cellW*0.22, cellH*0.25, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#FFE0BD";
                ctx.beginPath();
                ctx.ellipse(x+cellW/2, y+cellH*0.45, cellW*0.18, cellH*0.2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#4F2D1A";
                ctx.beginPath();
                ctx.arc(x+cellW*0.35, y+cellH*0.4, cellW*0.04, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+cellW*0.65, y+cellH*0.4, cellW*0.04, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#FFAAAA";
                ctx.beginPath();
                ctx.arc(x+cellW*0.25, y+cellH*0.5, cellW*0.04, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+cellW*0.75, y+cellH*0.5, cellW*0.04, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(x+cellW/2, y+cellH*0.65, cellW*0.16, cellH*0.18, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#FF6F61";
                ctx.beginPath();
                ctx.moveTo(x+cellW*0.4, y+cellH*0.25);
                ctx.lineTo(x+cellW/2, y+cellH*0.18);
                ctx.lineTo(x+cellW*0.6, y+cellH*0.25);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            let lili = players[0];
            let liliX = lili.x * cellW + cellW/2;
            let liliY = lili.y * cellH + cellH/2 - 5;
            catAngle += 0.03;
            for (let cat of cats) {
                let angle = catAngle + cat.offsetAngle;
                let catX = liliX + Math.cos(angle) * cat.radius;
                let catY = liliY + Math.sin(angle) * cat.radius * 0.6;
                ctx.save();
                if (cat.type === 'silver') ctx.fillStyle = "#C0C0C0";
                else ctx.fillStyle = "#E8A87C";
                ctx.beginPath();
                ctx.ellipse(catX, catY, 12, 10, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = cat.type==='silver' ? "#A9A9A9" : "#B57A4A";
                ctx.beginPath();
                ctx.moveTo(catX-8, catY-8);
                ctx.lineTo(catX-3, catY-2);
                ctx.lineTo(catX-11, catY-4);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(catX+8, catY-8);
                ctx.lineTo(catX+3, catY-2);
                ctx.lineTo(catX+11, catY-4);
                ctx.fill();
                ctx.fillStyle = cat.eyeColor;
                ctx.beginPath();
                ctx.arc(catX-4, catY-1, 2, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(catX+4, catY-1, 2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(catX-4.5, catY-1.5, 0.7, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(catX+3.5, catY-1.5, 0.7, 0, Math.PI*2);
                ctx.fill();
                ctx.font = "bold 10px 'Comic Neue'";
                ctx.fillStyle = "#4a2a1a";
                ctx.fillText(cat.name, catX-12, catY-12);
                ctx.restore();
            }

            for (let i=0; i<meteors.length; i++) {
                let m = meteors[i];
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.vx*3, m.y - m.vy*3);
                ctx.lineTo(m.x + m.vy*2, m.y - m.vx*2);
                ctx.fill();
                m.x += m.vx;
                m.y += m.vy;
                if (m.y > height || m.x < 0 || m.x > width) {
                    meteors.splice(i,1);
                    i--;
                }
            }
            ctx.font = "bold 12px 'Comic Neue'";
            ctx.fillStyle = "#4a2a1a";
            ctx.fillText("✨ 左滑李李 | 右滑毛毛 | 点格子建房子 | 长按拆除 | 飞行按钮", 20, 30);
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        // 事件绑定（触摸 + 鼠标放置）
        function getGridCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            const col = Math.floor(canvasX / cellW);
            const row = Math.floor(canvasY / cellH);
            return { row, col };
        }

        canvas.addEventListener('click', (e) => {
            const { row, col } = getGridCoord(e);
            if (row>=0 && row<gridH && col>=0 && col<gridW) placeItem(row, col);
        });
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const { row, col } = getGridCoord(e);
            if (row>=0 && row<gridH && col>=0 && col<gridW) removeItem(row, col);
        });
        // 长按拆除（手机）
        let pressTimer;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                pressTimer = setTimeout(() => {
                    const { row, col } = getGridCoord(e);
                    if (row>=0 && row<gridH && col>=0 && col<gridW) removeItem(row, col);
                }, 500);
            }
        });
        canvas.addEventListener('touchend', () => { clearTimeout(pressTimer); });
        canvas.addEventListener('touchmove', () => { clearTimeout(pressTimer); });

        // 触摸移动控制
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', handleTouchEnd);

        // 飞行按钮
        const flyBtn = document.getElementById('flyToggleBtn');
        flyBtn.addEventListener('click', () => {
            players[currentControl].fly = !players[currentControl].fly;
            flyBtn.innerText = players[currentControl].fly ? "🕊️ 落地" : "🕊️ 飞行模式";
        });
        // 点击飞行按钮时切换当前控制角色（便于用户知道当前切换的是谁）
        flyBtn.addEventListener('click', () => {
            currentControl = currentControl === 0 ? 1 : 0;
            flyBtn.innerText = players[currentControl].fly ? "🕊️ 落地" : "🕊️ 飞行模式";
        });

        // 键盘控制（保留）
        const keyState = {};
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'f' || key === 'F') {
                players[currentControl].fly = !players[currentControl].fly;
                flyBtn.innerText = players[currentControl].fly ? "🕊️ 落地" : "🕊️ 飞行模式";
                return;
            }
            if (key === 'Tab') {
                e.preventDefault();
                currentControl = currentControl === 0 ? 1 : 0;
                return;
            }
            keyState[key] = true;
        });
        window.addEventListener('keyup', (e) => { keyState[e.key] = false; });
        function handleKeyboard() {
            if (keyState['w'] || keyState['W']) movePlayer(0, 0, -1);
            if (keyState['s'] || keyState['S']) movePlayer(0, 0, 1);
            if (keyState['a'] || keyState['A']) movePlayer(0, -1, 0);
            if (keyState['d'] || keyState['D']) movePlayer(0, 1, 0);
            if (keyState['ArrowUp']) movePlayer(1, 0, -1);
            if (keyState['ArrowDown']) movePlayer(1, 0, 1);
            if (keyState['ArrowLeft']) movePlayer(1, -1, 0);
            if (keyState['ArrowRight']) movePlayer(1, 1, 0);
        }
        setInterval(handleKeyboard, 30);

        // UI初始化
        const paletteDiv = document.getElementById('colorPalette');
        colors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = c;
            btn.addEventListener('click', () => {
                currentColor = c;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                isFlowerMode = false;
                document.getElementById('flowerModeBtn').classList.remove('active');
            });
            paletteDiv.appendChild(btn);
        });
        document.querySelectorAll('.color-btn')[0].classList.add('active');
        const flowerBtnElem = document.getElementById('flowerModeBtn');
        flowerBtnElem.addEventListener('click', () => {
            isFlowerMode = !isFlowerMode;
            if (isFlowerMode) flowerBtnElem.classList.add('active');
            else flowerBtnElem.classList.remove('active');
        });
        document.getElementById('resetBtn').addEventListener('click', resetBuildings);

        resetBuildings();
        updatePosUI();
        animate();
    })();
</script>
</body>
</html>
