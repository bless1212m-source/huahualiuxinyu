<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>像素沙盒 · 李李 & 毛毛</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(145deg, #b8e1fc 0%, #9ac2e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', 'Comic Neue', monospace;
        }
        .game-container {
            background: #fdf8e7;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .toolbar {
            margin: 20px 10px 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }
        .color-palette {
            display: flex;
            gap: 8px;
            background: #fff0db;
            padding: 8px 15px;
            border-radius: 60px;
        }
        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: 0.1s;
        }
        .color-btn.active {
            border: 3px solid #ffaa33;
            transform: scale(1.1);
        }
        button {
            background: #ffb36b;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            color: white;
        }
        button:active {
            transform: scale(0.96);
        }
        .mode-btn {
            background: #8bc34a;
        }
        .mode-btn.active {
            background: #5a9e2e;
            box-shadow: 0 0 0 2px #ffdd88;
        }
        .info {
            background: #fff0db;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            gap: 20px;
        }
        .controls {
            font-size: 12px;
            color: #b97f44;
            margin-top: 12px;
        }
        @media (max-width: 800px) {
            .color-btn { width: 28px; height: 28px; }
            button { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="600" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/600"></canvas>
        <div class="toolbar">
            <div class="color-palette" id="colorPalette"></div>
            <button id="flowerModeBtn" class="mode-btn">🌻 种花模式</button>
            <button id="resetBtn">🗑️ 清除所有建筑</button>
            <div class="info">
                <span>🏠 李李: <span id="pos0">(0,0)</span></span>
                <span>🐱 毛毛: <span id="pos1">(0,0)</span></span>
                <span>⭐ 魔法星星: <span id="starCount">0</span></span>
            </div>
        </div>
        <div class="controls">
            🎮 李李: WASD &nbsp;&nbsp;|&nbsp;&nbsp; 🍀 毛毛: 方向键 &nbsp;&nbsp;|&nbsp;&nbsp;
            ✨ 点击格子: 放置/种花 (右键拆除) &nbsp;&nbsp;|&nbsp;&nbsp;
            🕊️ 按 F 键 让当前角色飞起来/落地
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const width = 1000, height = 600;
        canvas.width = width;
        canvas.height = height;

        // 网格参数
        const gridW = 25;
        const gridH = 15;
        const cellW = width / gridW;
        const cellH = height / gridH;

        // 游戏数据
        let blocks = [];
        for (let i=0; i<gridH; i++) {
            blocks[i] = [];
            for (let j=0; j<gridW; j++) blocks[i][j] = null;
        }

        const colors = [
            '#FFB7C5', '#A7E0E0', '#FFD966', '#98FB98', '#FFB347', '#C5E99B', '#F4A261', '#D9BF77'
        ];
        let currentColor = colors[0];
        let isFlowerMode = false;

        let players = [
            { name: '李李', x: 5, y: 5, fly: false, color: '#FFB7C5', hair: '#B5651E' },
            { name: '毛毛', x: 8, y: 7, fly: false, color: '#A7E0E0', hair: '#8B5A2B' }
        ];
        let currentControl = 0;

        // 小猫 (跟随李李)
        let cats = [
            { name: '钢镚', type: 'silver', eyeColor: '#88DD66', offsetAngle: 0, radius: 28, jumpY: 0, jumpSpeed: 0 },
            { name: '塑料袋', type: 'calico', eyeColor: '#88DD66', offsetAngle: Math.PI, radius: 28, jumpY: 0, jumpSpeed: 0 }
        ];
        let catAngle = 0;
        let catJumpTimer = 0;

        // 魔法星星
        let stars = [];
        let starTreeList = [];
        let meteors = [];
        let meteorTimer = null;

        function spawnRandomStar() {
            if (stars.length >= 5) return;
            let row, col;
            do {
                row = Math.floor(Math.random() * gridH);
                col = Math.floor(Math.random() * gridW);
            } while (blocks[row][col] !== null || isPlayerOn(row, col));
            stars.push({ x: col * cellW + cellW/2, y: row * cellH + cellH/2, row, col });
            updateStarUI();
        }

        function isPlayerOn(row, col) {
            return (players[0].y === row && players[0].x === col) || (players[1].y === row && players[1].x === col);
        }

        function collectStar(row, col) {
            let idx = stars.findIndex(s => s.row === row && s.col === col);
            if (idx !== -1) {
                stars.splice(idx,1);
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'starTree', plantedTime: Date.now() };
                    starTreeList.push({ row, col });
                }
                startMeteorShower();
                updateStarUI();
            }
        }

        function startMeteorShower() {
            if (meteorTimer) clearTimeout(meteorTimer);
            for (let i=0; i<60; i++) {
                meteors.push({
                    x: Math.random() * width,
                    y: Math.random() * height - 100,
                    vx: (Math.random() - 0.5) * 3 + 1,
                    vy: 2 + Math.random() * 4,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 70%)`
                });
            }
            meteorTimer = setTimeout(() => { meteorTimer = null; }, 5000);
        }

        function updateStarUI() {
            document.getElementById('starCount').innerText = stars.length;
        }

        function placeItem(row, col) {
            if (row<0 || row>=gridH || col<0 || col>=gridW) return false;
            if (isPlayerOn(row, col)) return false;
            if (isFlowerMode) {
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'flower', color: '#FFC0CB' };
                    return true;
                }
            } else {
                if (blocks[row][col] === null) {
                    blocks[row][col] = { type: 'block', color: currentColor };
                    return true;
                }
            }
            return false;
        }

        function removeItem(row, col) {
            if (blocks[row][col] !== null) {
                blocks[row][col] = null;
                starTreeList = starTreeList.filter(t => !(t.row === row && t.col === col));
                return true;
            }
            return false;
        }

        function movePlayer(pIdx, dx, dy) {
            let p = players[pIdx];
            let newX = p.x + dx;
            let newY = p.y + dy;
            if (newX<0 || newX>=gridW || newY<0 || newY>=gridH) return;
            if (!p.fly) {
                let target = blocks[newY][newX];
                if (target !== null && (target.type === 'block' || target.type === 'flower' || target.type === 'starTree')) {
                    return;
                }
            }
            p.x = newX;
            p.y = newY;
            let starIdx = stars.findIndex(s => s.row === p.y && s.col === p.x);
            if (starIdx !== -1) collectStar(p.y, p.x);
            updatePosUI();
        }

        function updatePosUI() {
            document.getElementById('pos0').innerText = `(${players[0].x},${players[0].y})`;
            document.getElementById('pos1').innerText = `(${players[1].x},${players[1].y})`;
        }

        function resetBuildings() {
            for (let i=0; i<gridH; i++)
                for (let j=0; j<gridW; j++) blocks[i][j] = null;
            starTreeList = [];
            stars = [];
            for (let i=0; i<3; i++) spawnRandomStar();
        }

        setInterval(() => {
            if (stars.length < 3 && Math.random() < 0.4) spawnRandomStar();
        }, 8000);

        // 小猫跳跃动画
        function updateCatsJump() {
            for (let cat of cats) {
                // 随机上下跳动，简单模拟
                cat.jumpY = Math.sin(Date.now() * 0.008 + cat.offsetAngle) * 4;
            }
        }

        // 像素风格绘图函数
        function drawPixelGirl(x, y, name, color, hairColor, fly) {
            const cx = x + cellW/2;
            const cy = y + cellH/2 - 2;
            const size = cellW * 0.5;
            const pixelSize = Math.max(2, Math.floor(cellW * 0.08));

            ctx.save();
            if (fly) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#FFDD88";
            }
            // 头 (方形像素)
            ctx.fillStyle = hairColor;
            ctx.fillRect(cx - size/2, cy - size/2, size, size);
            // 脸
            ctx.fillStyle = "#FFE0BD";
            ctx.fillRect(cx - size/2 + 2, cy - size/2 + 2, size-4, size-4);
            // 眼睛
            ctx.fillStyle = "#4F2D1A";
            ctx.fillRect(cx - size/4, cy - size/4, pixelSize, pixelSize);
            ctx.fillRect(cx + size/4 - pixelSize, cy - size/4, pixelSize, pixelSize);
            // 腮红
            ctx.fillStyle = "#FFAAAA";
            ctx.fillRect(cx - size/2 + 2, cy, pixelSize, pixelSize);
            ctx.fillRect(cx + size/2 - 2 - pixelSize, cy, pixelSize, pixelSize);
            // 头发装饰
            ctx.fillStyle = "#FF6F61";
            ctx.fillRect(cx - size/3, cy - size/2, size/3*2, pixelSize);
            // 身体 (方块)
            ctx.fillStyle = color;
            ctx.fillRect(cx - size/3, cy + size/4, size/3*2, size/2);
            // 手 (两条小线)
            ctx.fillStyle = color;
            ctx.fillRect(cx - size/2, cy + size/3, pixelSize, pixelSize*2);
            ctx.fillRect(cx + size/2 - pixelSize, cy + size/3, pixelSize, pixelSize*2);
            // 脚
            ctx.fillRect(cx - size/4, cy + size/2 + pixelSize, pixelSize, pixelSize);
            ctx.fillRect(cx + size/4 - pixelSize, cy + size/2 + pixelSize, pixelSize, pixelSize);
            ctx.restore();
        }

        function drawPixelCat(x, y, name, type, jumpY) {
            const cx = x;
            const cy = y + jumpY;
            const size = cellW * 0.3;
            const pixelSize = Math.max(2, Math.floor(cellW * 0.07));

            ctx.save();
            ctx.fillStyle = type === 'silver' ? "#C0C0C0" : "#E8A87C";
            // 身体
            ctx.fillRect(cx - size/2, cy - size/2, size, size);
            // 耳朵
            ctx.fillStyle = type === 'silver' ? "#A9A9A9" : "#B57A4A";
            ctx.fillRect(cx - size/2, cy - size/2 - pixelSize, pixelSize, pixelSize);
            ctx.fillRect(cx + size/2 - pixelSize, cy - size/2 - pixelSize, pixelSize, pixelSize);
            // 眼睛
            ctx.fillStyle = "#88DD66";
            ctx.fillRect(cx - size/4, cy - size/4, pixelSize, pixelSize);
            ctx.fillRect(cx + size/4 - pixelSize, cy - size/4, pixelSize, pixelSize);
            ctx.fillStyle = "#000";
            ctx.fillRect(cx - size/4, cy - size/4, pixelSize/2, pixelSize/2);
            ctx.fillRect(cx + size/4 - pixelSize/2, cy - size/4, pixelSize/2, pixelSize/2);
            // 胡子 (小短线)
            ctx.fillStyle = "#333";
            ctx.fillRect(cx - size/2, cy - size/6, pixelSize, pixelSize/2);
            ctx.fillRect(cx - size/2, cy, pixelSize, pixelSize/2);
            ctx.fillRect(cx + size/2 - pixelSize, cy - size/6, pixelSize, pixelSize/2);
            ctx.fillRect(cx + size/2 - pixelSize, cy, pixelSize, pixelSize/2);
            // 尾巴
            ctx.fillStyle = type === 'silver' ? "#A9A9A9" : "#B57A4A";
            ctx.fillRect(cx + size/2, cy + size/4, pixelSize, pixelSize*2);
            // 腿
            ctx.fillRect(cx - size/3, cy + size/4, pixelSize, pixelSize);
            ctx.fillRect(cx + size/3 - pixelSize, cy + size/4, pixelSize, pixelSize);
            // 名字
            ctx.font = `${Math.max(8, Math.floor(cellW*0.12))}px "Courier New"`;
            ctx.fillStyle = "#4a2a1a";
            ctx.fillText(name, cx - 10, cy - size/2 - 2);
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = "#b3d9a0";
            ctx.fillRect(0,0,width,height);
            ctx.strokeStyle = "#d9d0a5";
            ctx.lineWidth = 1;
            for (let i=0; i<=gridW; i++) {
                ctx.beginPath();
                ctx.moveTo(i*cellW,0);
                ctx.lineTo(i*cellW,height);
                ctx.stroke();
                ctx.moveTo(0,i*cellH);
                ctx.lineTo(width,i*cellH);
                ctx.stroke();
            }

            // 绘制砖块、花、星星树
            for (let row=0; row<gridH; row++) {
                for (let col=0; col<gridW; col++) {
                    let item = blocks[row][col];
                    if (!item) continue;
                    let x = col * cellW;
                    let y = row * cellH;
                    if (item.type === 'block') {
                        ctx.fillStyle = item.color;
                        ctx.fillRect(x+1, y+1, cellW-2, cellH-2);
                        ctx.fillStyle = "rgba(0,0,0,0.1)";
                        ctx.fillRect(x+2, y+2, cellW-4, 3);
                    } else if (item.type === 'flower') {
                        ctx.fillStyle = "#FFC0CB";
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, cellW*0.3, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#F06292";
                        for (let i=0;i<5;i++) {
                            let ang = i*Math.PI*2/5;
                            let px = x+cellW/2 + Math.cos(ang)*cellW*0.2;
                            let py = y+cellH/2 + Math.sin(ang)*cellW*0.2;
                            ctx.beginPath();
                            ctx.arc(px, py, cellW*0.12, 0, Math.PI*2);
                            ctx.fill();
                        }
                    } else if (item.type === 'starTree') {
                        ctx.fillStyle = "#8B5A2B";
                        ctx.fillRect(x+cellW*0.4, y+cellH*0.5, cellW*0.2, cellH*0.3);
                        ctx.fillStyle = "#FFD966";
                        ctx.beginPath();
                        ctx.moveTo(x+cellW/2, y+cellH*0.3);
                        ctx.lineTo(x+cellW*0.3, y+cellH*0.5);
                        ctx.lineTo(x+cellW*0.7, y+cellH*0.5);
                        ctx.fill();
                        ctx.fillStyle = "#FFB347";
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH*0.2, cellW*0.12, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }

            // 星星
            for (let s of stars) {
                ctx.fillStyle = "#FFD966";
                let spikes = 5, outer = cellW*0.25, inner = cellW*0.12;
                let cx = s.x, cy = s.y;
                ctx.beginPath();
                for (let i=0; i<spikes*2; i++) {
                    let rad = (i * Math.PI*2 / (spikes*2)) - Math.PI/2;
                    let r = (i%2===0) ? outer : inner;
                    let px = cx + Math.cos(rad)*r;
                    let py = cy + Math.sin(rad)*r;
                    if (i===0) ctx.moveTo(px,py);
                    else ctx.lineTo(px,py);
                }
                ctx.fill();
                ctx.fillStyle = "#FFB347";
                ctx.beginPath();
                ctx.arc(cx, cy, cellW*0.08, 0, Math.PI*2);
                ctx.fill();
            }

            // 绘制角色
            for (let p of players) {
                let x = p.x * cellW;
                let y = p.y * cellH;
                drawPixelGirl(x, y, p.name, p.color, p.hair, p.fly);
            }

            // 小猫跟随李李，转圈+跳跃
            let lili = players[0];
            let liliX = lili.x * cellW + cellW/2;
            let liliY = lili.y * cellH + cellH/2 - 6;
            catAngle += 0.03;
            updateCatsJump();
            for (let cat of cats) {
                let angle = catAngle + cat.offsetAngle;
                let catX = liliX + Math.cos(angle) * cat.radius;
                let catY = liliY + Math.sin(angle) * cat.radius * 0.6;
                drawPixelCat(catX, catY, cat.name, cat.type, cat.jumpY);
            }

            // 流星雨
            for (let i=0; i<meteors.length; i++) {
                let m = meteors[i];
                ctx.fillStyle = m.color;
                ctx.fillRect(m.x, m.y, 4, 2);
                m.x += m.vx;
                m.y += m.vy;
                if (m.y > height || m.x < 0 || m.x > width) {
                    meteors.splice(i,1);
                    i--;
                }
            }
            ctx.font = "bold 12px 'Courier New'";
            ctx.fillStyle = "#4a2a1a";
            ctx.fillText("✨ 点击颜色砖 → 点格子建房子 | 🌻种花模式 | ⭐踩星星 → 星星树+流星雨 | F 飞行", 20, 30);
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        // 事件绑定（同原版）
        function getGridCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            const col = Math.floor(canvasX / cellW);
            const row = Math.floor(canvasY / cellH);
            return { row, col };
        }

        canvas.addEventListener('click', (e) => {
            const { row, col } = getGridCoord(e);
            if (row>=0 && row<gridH && col>=0 && col<gridW) placeItem(row, col);
        });
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const { row, col } = getGridCoord(e);
            if (row>=0 && row<gridH && col>=0 && col<gridW) removeItem(row, col);
        });

        let pressTimer;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                pressTimer = setTimeout(() => {
                    const { row, col } = getGridCoord(e);
                    if (row>=0 && row<gridH && col>=0 && col<gridW) removeItem(row, col);
                }, 500);
            }
        });
        canvas.addEventListener('touchend', () => clearTimeout(pressTimer));
        canvas.addEventListener('touchmove', () => clearTimeout(pressTimer));

        // 键盘控制
        const keyState = {};
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'f' || key === 'F') {
                players[currentControl].fly = !players[currentControl].fly;
                return;
            }
            if (key === 'Tab') {
                e.preventDefault();
                currentControl = currentControl === 0 ? 1 : 0;
                return;
            }
            keyState[key] = true;
        });
        window.addEventListener('keyup', (e) => { keyState[e.key] = false; });

        function handleMovement() {
            if (keyState['w'] || keyState['W']) movePlayer(0, 0, -1);
            if (keyState['s'] || keyState['S']) movePlayer(0, 0, 1);
            if (keyState['a'] || keyState['A']) movePlayer(0, -1, 0);
            if (keyState['d'] || keyState['D']) movePlayer(0, 1, 0);
            if (keyState['ArrowUp']) movePlayer(1, 0, -1);
            if (keyState['ArrowDown']) movePlayer(1, 0, 1);
            if (keyState['ArrowLeft']) movePlayer(1, -1, 0);
            if (keyState['ArrowRight']) movePlayer(1, 1, 0);
        }
        setInterval(handleMovement, 30);

        // UI 初始化
        const paletteDiv = document.getElementById('colorPalette');
        colors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = c;
            btn.addEventListener('click', () => {
                currentColor = c;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                isFlowerMode = false;
                document.getElementById('flowerModeBtn').classList.remove('active');
            });
            paletteDiv.appendChild(btn);
        });
        document.querySelectorAll('.color-btn')[0].classList.add('active');

        const flowerBtn = document.getElementById('flowerModeBtn');
        flowerBtn.addEventListener('click', () => {
            isFlowerMode = !isFlowerMode;
            if (isFlowerMode) flowerBtn.classList.add('active');
            else flowerBtn.classList.remove('active');
        });

        document.getElementById('resetBtn').addEventListener('click', resetBuildings);

        resetBuildings();
        updatePosUI();
        animate();
    })();
</script>
</body>
</html>
